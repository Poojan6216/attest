# Proposes updates for the SHA-pinned CI actions and the npm dependencies (Hard Rule 9: supply chain).
# Every update arrives as a PR that runs the full CI, the two @mandatory tests included.
# Monthly and grouped: one PR per ecosystem, so a private repo's Actions minutes are not spent on one
# full CI run per package. Major versions are never proposed automatically: §5 locks some tool lines
# (TypeScript 5.x, Node 22), and every major upgrade is a deliberate change with a Decisions.md entry.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite setup action every job runs.
    directories: ['/', '/.github/actions/setup']
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directories: ['/', '/extension']
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 2
