name: ci

on:
  # Pushes to main, and every pull request (one run per PR, not one per push plus one per PR).
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the version is in the comment); Dependabot proposes updates
# (.github/dependabot.yml). Hard Rule 9 for the build supply chain.
# Five jobs run side by side, each inside its 30-minute limit. As one job the steps ran in turn and did not fit: CI
# run 37674271045 took 2.3 min for lint, 9.5 min for the unit and property tests and 16.5 min for core coverage, and
# was cancelled at 30 minutes in observer coverage. Split (run 37691867866, measured): unit 8.9 min, core coverage
# 12.9, observer coverage 4.1, runtime guard and time zones 20.3 (the closest to its limit), build and e2e 12.3.
# CI's runner gives Vitest one worker. Each job installs from the pnpm cache (./.github/actions/setup). Two more jobs
# check the telemetry API (sprint_5 5.6, 5.8): its own lockfile, lint, strict types, tests (the payload schema's parity
# with the extension's among them) and known vulnerabilities; and its image with Mongo, the flow proven end to end.
jobs:
  unit:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup (pnpm, Node, install)
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + property tests
        run: pnpm test

  coverage:
    name: core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup (pnpm, Node, install)
        uses: ./.github/actions/setup

      # The Sprint 1 Gate's "core coverage >= 95%": the suite again, instrumented. Prints lines, branches, functions
      # and statements for src/core and fails below 95% lines (extension/vitest.config.ts).
      - name: Core coverage
        run: pnpm test:coverage

  observers:
    name: observer coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup (pnpm, Node, install)
        uses: ./.github/actions/setup

      # qa_tester rule 8 (QA-8): the observers stay at or above 85% of lines, measured over the suites that run them
      # (extension/vitest.observers.config.ts).
      - name: Observer coverage
        run: pnpm test:coverage:observers

  ui:
    name: ui coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup (pnpm, Node, install)
        uses: ./.github/actions/setup

      # qa_tester rule 8 (sprint_4 close, QA review GAP 14): src/ui and the four pages stay at or above 70% of lines,
      # measured over the suites that render them (extension/vitest.ui.config.ts).
      - name: UI coverage
        run: pnpm test:coverage:ui

  guard:
    name: runtime guard · time zones
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup (pnpm, Node, install)
        uses: ./.github/actions/setup

      # src/core under the runtime guard (Hard Rule 4): every core, golden and property test with every impure global
      # poisoned before src/core loads; fails on any impure use, any changed built-in, or below 95% of src/core's lines.
      - name: Core under the runtime guard
        run: pnpm test:poison

      # src/core must not depend on the host time zone (Hard Rule 4): run the core suites in two more zones.
      - name: Core tests in other time zones
        run: pnpm --dir extension run test:tz

  telemetry-api:
    name: telemetry-api · ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telemetry-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.1'

      # Exactly the locked versions (telemetry-api/uv.lock): an install that would change the lock fails.
      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy app tests

      # Includes the payload schema's parity with the extension's (tests/test_schema_parity.py).
      - name: Tests
        run: uv run pytest

      # Known vulnerabilities in the locked dependencies (sprint_5 5.8): any one fails the job.
      - name: pip-audit
        run: uv run pip-audit

  telemetry-api-flow:
    name: telemetry-api · docker flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telemetry-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.1'

      - name: Install
        run: uv sync --locked

      # The API's image and Mongo, both pinned by digest (docker-compose.yml), up and healthy. A step that fails prints
      # the stack's log within itself, since no test step here is conditional (tests/unit/harness/mandatory-guard.spec.ts);
      # the runner, the stack with it, is discarded when the job ends.
      - name: Start the stack
        run: docker compose up --build --wait || { docker compose logs; exit 1; }

      # sprint_5 5.8 done-when: the flow end to end, and no address in what is stored (scripts/prove_flow.py).
      - name: Prove the flow
        run: uv run python scripts/prove_flow.py || { docker compose logs api; exit 1; }

  e2e:
    name: build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job token is not left in .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      - name: Setup (pnpm, Node, install)
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --dir extension exec playwright install --with-deps chromium

      # The two tests that define the product (Hard Rules 1, 2, 10). Never skipped, retried, or weakened.
      - name: E2E (@mandatory)
        run: pnpm --dir extension exec playwright test --grep @mandatory --reporter=list,json
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: mandatory-report.json

      - name: Check every @mandatory test ran and passed
        run: pnpm --dir extension exec tsx tests/tools/check-mandatory-report.ts mandatory-report.json

      - name: E2E (rest)
        run: pnpm --dir extension exec playwright test --grep-invert @mandatory
        env:
          CI: 'true'

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-mv3
          path: extension/.output/chrome-mv3/
          # .output is a dot-directory; upload-artifact v4 skips hidden paths by default (QA-1).
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: extension/playwright-report/
          if-no-files-found: ignore
