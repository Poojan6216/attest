# The telemetry API and its database on one machine (sprint_5 5.8): `docker compose up --build --wait`, then
# `uv run python -m scripts.prove_flow`, then `docker compose down -v`. CI runs the first two, on a runner discarded
# after. Images pinned by digest. Mongo is published on 27117, not its usual 27017, so the stack never meets a Mongo
# already running on the machine.
services:
  mongo:
    image: mongo:7.0@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    ports:
      - "127.0.0.1:27117:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: attest_telemetry
      ALLOWED_EXT_IDS: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TRUST_FORWARDED_FOR: "false"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
