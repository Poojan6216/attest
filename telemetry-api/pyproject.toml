[project]
name = "attest-telemetry-api"
version = "0.1.0"
description = "Attest's one server: the opt-in daily counts from the extension, validated, stored and summed into public monthly totals, and nothing else."
requires-python = ">=3.12,<3.13"
license = "FSL-1.1-ALv2"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.13,<5",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mongomock>=4.3",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "BLE", "TRY"]
ignore = ["S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# The payload's keys are the extension's, camelCase, so its JSON Schema matches (app/schema.py); nothing else is.
"app/schema.py" = ["N815"]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
