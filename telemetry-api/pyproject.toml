[project]
name = "attest-telemetry-api"
version = "0.1.0"
description = "Attest's one server: the opt-in daily counts from the extension, validated and stored, and nothing else."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "BLE", "TRY"]
ignore = ["S101", "N815", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
