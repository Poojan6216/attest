<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #ffffff;
        --rule: #d1d9e0;
        --link: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6edf3;
          --muted: #9198a1;
          --bg: #0d1117;
          --rule: #3d444d;
          --link: #4493f8;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      a {
        color: var(--link);
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
      }
      h2 {
        border-bottom: 1px solid var(--rule);
        padding-bottom: 0.3em;
      }
      code {
        font-size: 0.9em;
        overflow-wrap: anywhere;
      }
      pre {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
      }
      th,
      td {
        border: 1px solid var(--rule);
        padding: 0.3em 0.6em;
      }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
